# S32K3X4EVB-T172 (S32K344) with an external hardware tester board whose DAC
# output drives the potentiometer ADC input (PTA11, channel 0); set the port of
# the tester under [hw_tester_serial]. Flash/reset expects a PE Micro GDB server on
# localhost:7224, e.g.:
#   pegdbserver_console -device=NXP_S32K3xx_S32K344 -startserver -serverport=7224

[socketcan]
channel = "can0"

[serial]
port = "/dev/ttyACM0"
baudrate = 115200
write_byte_delay = 0.01
send_command_expected = "Console command succeeded"
send_command_timeout = 0.1
send_command_max_retries = 2

[freertos.per_run_process]
command_line = "arm-none-eabi-gdb -batch -x flash.gdb ../../build/s32k344-freertos/executables/referenceApp/application/RelWithDebInfo/app.referenceApp.elf > /dev/null 2>&1"
wait_for_exit = true

[freertos.target_process]
command_line = "arm-none-eabi-gdb -batch -x reset.gdb ../../build/s32k344-freertos/executables/referenceApp/application/RelWithDebInfo/app.referenceApp.elf > /dev/null 2>&1"
wait_for_exit = true
skip_first = true

[boot]
started_str = "DEBUG: Run level 1"
complete_str = "INFO: Run level 9 done"
max_time = 1.5

# Test suites that need a feature not available on this platform are skipped.
[features]
storage = false
ethernet = false
middleware = false

# Channel wired to the hardware tester's DAC output for console/test_adc.py.
[adc]
channel = 0
name = "AiEval_Poti_ADC"
tolerance_mv = 100

[hw_tester_serial]
port = "/dev/ttyACM1"
baudrate = 115200
write_byte_delay = 0.01
send_command_expected = "returned 0"
send_command_timeout = 0.1
send_command_max_retries = 2
